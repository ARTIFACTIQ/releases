name: Model Benchmark

on:
  # Trigger on new model release tags
  push:
    tags:
      - 'v*'
  # Manual trigger for testing
  workflow_dispatch:
    inputs:
      model_version:
        description: 'Model version to benchmark (e.g., v5.0.0)'
        required: true
        default: 'v5.0.0'

jobs:
  benchmark:
    runs-on: macos-latest
    steps:
      - name: Checkout releases repo
        uses: actions/checkout@v4

      - name: Set model version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.model_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Install Artifactiq CLI
        run: |
          curl -fsSL https://artifactiq.ai/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install Python dependencies
        run: pip3 install --user requests

      - name: Download and benchmark model
        run: |
          MODEL_VERSION="${{ steps.version.outputs.version }}"
          echo "Benchmarking model: artifactiq:${MODEL_VERSION}"

          # Create benchmarks directory
          mkdir -p benchmarks

          # Run benchmark on test images
          python3 scripts/benchmark-model.py \
            --model "artifactiq:${MODEL_VERSION}" \
            --images images/ \
            --confidence 0.25 \
            --output "benchmarks/${MODEL_VERSION}.json"

          # Also benchmark stock YOLOv8n for comparison
          python3 scripts/benchmark-model.py \
            --model yolov8n \
            --images images/ \
            --confidence 0.25 \
            --output benchmarks/stock-yolov8n.json

      - name: Display benchmark results
        run: |
          echo "=== Benchmark Results ==="
          for f in benchmarks/*.json; do
            echo "--- $(basename $f) ---"
            cat "$f" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Total detections: {d[\"total_detections\"]}'); print(f'Avg time: {d[\"avg_time_ms\"]:.0f}ms')"
          done

      - name: Upload benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ steps.version.outputs.version }}
          path: benchmarks/
          retention-days: 90

      - name: Generate image cards preview
        run: |
          MODEL_VERSION="${{ steps.version.outputs.version }}"

          # Generate markdown summary for PR/commit
          echo "## Model Benchmark: ${MODEL_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY

          python3 -c "
          import json
          with open('benchmarks/${MODEL_VERSION}.json') as f:
              d = json.load(f)
          print(f'| Model | {d[\"model\"]} |')
          print(f'| Images | {d[\"total_images\"]} |')
          print(f'| Detections | {d[\"total_detections\"]} |')
          print(f'| Avg Time | {d[\"avg_time_ms\"]:.0f}ms |')
          " >> $GITHUB_STEP_SUMMARY

  # Optional: Auto-update website on main branch
  update-website:
    needs: benchmark
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results-${{ github.ref_name }}
          path: benchmarks/

      - name: Create PR with updated showdown (optional)
        run: |
          echo "Benchmark results available in benchmarks/"
          echo "Manual review required before updating website"
          # Future: Auto-create PR with updated index.html
